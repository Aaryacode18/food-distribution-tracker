# The node the Food Distribution Tracker is deployed to.
#
# One host, because there is one environment to configure. The name is the
# Docker container name, and ansible_connection=docker tells Ansible to run
# its modules with `docker exec` inside that container instead of ssh-ing
# anywhere - the node has no sshd and no open port for it.
#
# ansible_become=false looks wrong at first glance (docker exec already
# starts as root, and the container has no sudo to become with).
# ansible_python_interpreter is set explicitly so Ansible does not have to
# guess on a minimal image.

[fdt_nodes]
fdt-node ansible_connection=docker ansible_python_interpreter=/usr/bin/python3 ansible_become=false
