name: Feature request
description: Propose new behaviour for the Food Distribution Tracker
labels: enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: What can't you do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true

  - type: dropdown
    id: mvp
    attributes:
      label: Is this inside the approved MVP scope?
      options:
        - Data/event entry
        - Searchable dashboard
        - Summary indicators
        - Status drill-down
        - Alert/exception view
        - Infrastructure / CI-CD
        - Outside MVP scope
    validations:
      required: true
