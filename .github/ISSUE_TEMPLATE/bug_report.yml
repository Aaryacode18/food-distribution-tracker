name: Bug report
description: Something in the application behaves incorrectly
labels: bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      placeholder: Describe the incorrect behaviour.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open http://localhost:8081/food-distribution-tracker/
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Branch or tag
      placeholder: main

  - type: textarea
    id: logs
    attributes:
      label: Error message or log output
      render: text
